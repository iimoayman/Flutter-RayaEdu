name: raya_edu
description: "Raya Higher Institute - Educational Portal"
publish_to: "none"
version: 1.1.13+37

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.2

  # Networking & Serialization
  dio: ^5.4.1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  http_parser: ^4.0.2

  # Secure Storage & Persistence
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Security, Anti-Tamper & Biometrics
  safe_device: ^1.1.4
  local_auth: ^2.1.8
  screen_protector: ^1.4.2

  # Camera & QR
  mobile_scanner: ^5.0.0
  qr_flutter: ^4.1.0

  # Sensors & Device Hardware
  sensors_plus: ^5.0.0

  # Firebase Core, Cloud Messaging & Firestore
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  cloud_firestore: ^4.15.8

  # UI, Icons, Typography & Page Indicators
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.1.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  intl: ^0.20.2
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/raw/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairoblack.ttf
          weight: 900
        - asset: assets/fonts/cairoextrabold.ttf
          weight: 800
    - family: TBold
      fonts:
        - asset: assets/fonts/t_bold.ttf
          weight: 700
    - family: TMed
      fonts:
        - asset: assets/fonts/t_med.ttf
          weight: 500
