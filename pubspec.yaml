name: rayaedu
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Networking / auth ─────────────────────────────────────────
  http: ^1.2.0
  dio: ^5.4.3
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # ── Storage ───────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # ── UI ────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1        # profile image w/ auth headers
  lottie: ^3.1.2                      # ← NEW — Lottie animations

  # ── Platform ──────────────────────────────────────────────────
  screen_protector: ^1.5.1

  # ── Runtime deps that were in dev_dependencies ────────────────
  go_router: ^16.2.1                  # MOVED from dev
  url_launcher: ^6.3.2                # MOVED from dev

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_icons:
  android: true
  ios: true
  image_path: "assets/imgs/iraya.png"

flutter_native_splash:
  color: "#005e39"
  image: assets/imgs/iraya.png
  android: true
  ios: true
  android_12:
    color: "#005e39"
    image: "assets/imgs/iraya.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/imgs/
    - assets/lottie/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo_ExtraBold.ttf
          weight: 700